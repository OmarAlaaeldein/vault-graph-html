name: Mirror nullexit demo graph

# nullexit's own pre-commit hook regenerates knowledge-graph.html on every
# commit and tracks it in the repo, but the vault it's built from is
# .gitignored there (private notes), so there's nothing for us to rebuild
# from. This just republishes that already-public, self-contained artifact
# here on a schedule, giving vault-graph a live real-world demo without any
# access to nullexit beyond its public HTML file.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch nullexit's knowledge-graph.html
        run: |
          mkdir -p site
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/OmarAlaaeldein/nullexit/main/knowledge-graph.html" \
            -o site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
